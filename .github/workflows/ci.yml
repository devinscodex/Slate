name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: System packages
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends xvfb python3-tk fonts-dejavu-core qpdf
      - run: pip install -r requirements.txt
      - run: xvfb-run -a python -m pytest tests/ -q
