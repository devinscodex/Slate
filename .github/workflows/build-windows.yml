name: build-windows

on:
  push:
    branches: [release, suckless-hardening-review]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt pyinstaller
      - name: Freeze
        run: python -m PyInstaller Slate.spec --noconfirm
      - name: Smoke test
        shell: pwsh
        run: |
          $p = Start-Process dist\Slate\Slate.exe -PassThru
          Start-Sleep -Seconds 6
          if ($p.HasExited) { throw "Slate.exe exited with code $($p.ExitCode)" }
          Stop-Process -Id $p.Id -Force
      - name: Installer
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          $v = (Select-String -Path version.py -Pattern '^VERSION = "([^"]+)"').Matches[0].Groups[1].Value
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DMyAppVersion=$v" installer\slate.iss
      - name: Checksums
        shell: pwsh
        run: |
          Compress-Archive -Path dist\Slate -DestinationPath dist-installer\Slate-portable.zip
          Get-ChildItem dist-installer\* | ForEach-Object {
            "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)"
          } | Set-Content dist-installer\SHA256SUMS.txt
      - uses: actions/upload-artifact@v7
        with:
          name: slate-windows
          path: dist-installer/*
